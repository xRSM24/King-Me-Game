name: Publish Jumpgrave

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          SITE_ID="${NETLIFY_SITE_ID:-$(node -p "require('./netlify.site.json').id")}"
          npx --yes netlify-cli deploy --prod --dir=dist --auth "$NETLIFY_AUTH_TOKEN" --site "$SITE_ID"
          echo "SITE_ID=$SITE_ID" >> "$GITHUB_ENV"
      - name: Make the production URL public
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          SITE_ID="${NETLIFY_SITE_ID:-$SITE_ID}"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sso_login":false}' \
            "https://api.netlify.com/api/v1/sites/$SITE_ID" >/dev/null
