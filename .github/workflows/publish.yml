name: Publish Hop Crown

# Production deploys cost 15 Netlify credits each. Do not run this on every
# push — Free is 300 credits/month, then the site pauses until next cycle.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          SITE_ID="${NETLIFY_SITE_ID:-$(node -p "require('./netlify.site.json').id")}"
          npx --yes netlify-cli deploy --prod --dir=dist --auth "$NETLIFY_AUTH_TOKEN" --site "$SITE_ID"
